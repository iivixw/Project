version: "3.9"
services:
  db:
    image: mysql:5.7
    container_name: xampp_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: xampp_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
    ports:
    - "3307:3306" 

  api:
    build: ./api
    container_name: api_server
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: user
      DB_PASS: password
      DB_NAME: xampp_db
    ports:
      - "5000:5000"  # REST API ออกมาที่ host:5000
    working_dir: /usr/src/app
    command: ["node","server.js"]
    volumes:
      - ./api:/usr/src/app:rw

volumes:
  db_data:
