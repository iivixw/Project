version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
      # ปิดกำแพงรหัสผ่านแบบเก่า ถ้าแอพคุณต้องการ ให้คงค่า default ไว้ถ้าไม่จำเป็น
      # MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306" # ด้านนอกเครื่องใช้ 3307 (ตามที่เคยพยายามต่อ), ภายในคอนเทนเนอร์ยังคง 3306
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api
    env_file:
      - ./api/.env
    environment:
      # หากไม่มีใน .env จะใช้ค่าด้านล่างเป็นค่าเริ่ม
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASS: apppass
      PORT: "5000"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./api:/usr/src/app
      - /usr/src/app/node_modules

  waste:
    build:
      context: ./waste
    container_name: waste
    environment:
      # สำหรับ Vite/CRA ให้ dev server bind 0.0.0.0
      HOST: 0.0.0.0
      PORT: "5173" # ถ้าเป็น CRA เปลี่ยนเป็น 3000 ได้
      # ถ้าต้องเรียก API ภายนอก
      VITE_API_URL: http://localhost:5000
      REACT_APP_API_URL: http://localhost:5000
    ports:
      - "5173:5173" # ถ้าใช้ CRA เปลี่ยนเป็น "3000:3000"
    working_dir: /usr/src/app
    volumes:
      - ./waste:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npm install && (npm run dev -- --host || npm start -- --host)"

  xampp:
    build:
      context: ./xampp
      dockerfile: Dockerfile
    container_name: xampp
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PHP_DISPLAY_ERRORS: "On"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASS: apppass
    ports:
      - "8080:80"
    volumes:
      - ./xampp:/var/www/html

  phpmyadmin:
    image: phpmyadmin:5
    container_name: phpmyadmin
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    ports:
      - "8085:80"

volumes:
  db_data:
