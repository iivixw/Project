services:
  web:
    build: .
    container_name: xampp_web
    volumes:
      - ./htdocs:/var/www/html
    ports:
      - "8080:80"

  db:
    image: mysql:5.7
    container_name: xampp_db
    restart: always
    environment:
      MYSQL_DATABASE: xampp_db
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      # ใช้ root no-password ได้เลย; ถ้าอยากมี user อื่นค่อยสร้างทีหลัง
      # MYSQL_USER/MYSQL_PASSWORD เว้นไว้ไม่ต้องกำหนด
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: xampp_phpmyadmin
    restart: always
    environment:
      PMA_ARBITRARY: 0
    ports:
      - "8081:80"
    volumes:
      - ./pma-config/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro

volumes:
  db_data:
